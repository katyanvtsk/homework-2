<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <main>
        <div class="buttons">
            <h2 class="buttons__headline">Buttons</h2>
            <div class="buttons__group buttons__group_orange">
                <h3 class="buttons__title">Primary/Primary</h3>
                    <div class="button-row">
                        <button class="button button_orange">Button</button>
                        <button class="button button_orange-disable">Disable</button>
                    </div>
            </div>

            <div class="buttons__group buttons__group_blue">
                <h3 class="buttons__title">Primary/Secondary</h3>
                    <div class="button-row">
                        <button class="button button_blue">Button</button>
                        <button class="button button_blue-disable">Disable</button>
                    </div>
            </div>

            <div class="buttons__group buttons__group_arrow">
                <h3 class="buttons__title">Simple Buttons</h3>
                    <div class="button-row">
                        <button class="button-arrow button-arrow_green">
                            Normal
                            <div class="button-arrow__wrapper">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M3.75 12H20.25" stroke="#23BD33" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M13.5 5.25L20.25 12L13.5 18.75" stroke="#23BD33" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                        </button>

                        <button class="button-arrow button-arrow_red">
                            Normal
                            <div class="button-arrow__wrapper">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M3.75 12H20.25" stroke="#E34444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M13.5 5.25L20.25 12L13.5 18.75" stroke="#E34444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                        </button>
                    </div>
            </div>
        </div>
    </main>
</body>
</html>
